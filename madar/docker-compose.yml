services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: madar
      POSTGRES_PASSWORD: madar
      POSTGRES_DB: madar
    ports: ["5432:5432"]
    volumes: [madar-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U madar"]
      interval: 5s
      retries: 10
volumes:
  madar-db:
